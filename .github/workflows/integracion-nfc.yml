
name: Validar integración NFC

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compilar aplicación Android
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataformas y herramientas Android
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación web
        run: npm run build

      - name: Ejecutar pruebas
        run: >
          npm test -- --watch=false
          --include='src/app/services/*.spec.ts'
          --include='src/app/community/*.spec.ts'
          --include='src/app/home/*.spec.ts'
          --include='src/app/noticias/*.spec.ts'
          --include='src/app/reportes/*.spec.ts'

      - name: Revisar código con ESLint
        run: >
          npx eslint
          src/app/community
          src/app/home/home.page.html
          src/app/home/home.module.ts
          src/app/home/home.page.spec.ts
          src/app/services/community.service.ts
          src/app/services/community-ble.service.ts
          src/app/services/nfc.service.ts
          src/app/services/nfc.service.spec.ts
          src/app/services/community.service.spec.ts

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Generar APK de Android
        run: bash gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: comunidad-alerta-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
